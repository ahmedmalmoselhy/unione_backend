services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: unione_backend:latest
    container_name: unione_app
    restart: always
    working_dir: /var/www/html
    ports:
      - "8080:80"
    environment:
      - APP_NAME=Laravel
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=unione_backend
      - DB_USERNAME=${DB_USERNAME:-unione_user}
      - DB_PASSWORD=${DB_PASSWORD:-unione_password}
      - CACHE_STORE=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=database
      - MAIL_MAILER=log
    depends_on:
      db:
        condition: service_healthy
    networks:
      - unione_network

  db:
    image: postgres:16-alpine
    container_name: unione_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: unione_backend
      POSTGRES_USER: ${DB_USERNAME:-unione_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unione_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-unione_user} -d unione_backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - unione_network

networks:
  unione_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
